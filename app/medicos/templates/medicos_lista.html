{% extends "base.html" %}
{% block titulo %}Médicos{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Médicos</h1>
    <a href="{{ url_for('bp_medicos.nuevo') }}" class="btn btn-success">+ Nuevo médico</a>
</div>

<table class="table table-striped table-hover bg-white shadow-sm align-middle">
    <thead class="table-success">
        <tr><th>ID</th><th>Nombre</th><th>Especialidad</th><th>Citas</th><th class="text-end">Acciones</th></tr>
    </thead>
    <tbody>
    {% for x in medicos %}
        <tr>
            <td>{{ x.id }}</td>
            <td>{{ x.nombre }}</td>
            <td>{{ x.especialidad }}</td>
            <td>{{ x.citas|length }}</td>
            <td class="text-end">
                <a href="{{ url_for('bp_medicos.editar', id=x.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <form action="{{ url_for('bp_medicos.eliminar', id=x.id) }}" method="POST" class="d-inline"
                      onsubmit="return confirm('¿Eliminar este registro?')">
                    <button class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
