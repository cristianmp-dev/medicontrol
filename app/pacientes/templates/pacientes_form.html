{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if paciente else 'Nuevo' }} paciente{% endblock %}

{% block contenido %}
<div class="card shadow-sm col-lg-6">
    <div class="card-body">
        <h1 class="h4 mb-3">{{ 'Editar' if paciente else 'Nuevo' }} paciente</h1>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" value="{{ paciente.nombre if paciente }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono if paciente }}" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('bp_pacientes.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
